[project]
name = "ingest"
version = "0.1.0"
description = "Provenance ingestion: approved Markdown to a versioned hybrid-search index"
readme = "README.md"
authors = [{ name = "Michael Rollinson" }]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs Postgres (set PROVENANCE_TEST_DATABASE_URL)"]
