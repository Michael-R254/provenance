# Local development database: Postgres with the pgvector extension.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance-local-only
      POSTGRES_DB: provenance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance -d provenance"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
